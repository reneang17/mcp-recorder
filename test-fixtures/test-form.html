<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCP Recorder Test Form</title>
</head>
<body>
  <h1>Test Form</h1>
  <form id="test-form" action="/submit" method="POST">
    <div>
      <label for="username">Username:</label>
      <input type="text" id="username" name="username" data-testid="username-input" />
    </div>
    <div>
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" data-testid="email-input" />
    </div>
    <div>
      <label for="message">Message:</label>
      <textarea id="message" name="message" data-testid="message-input"></textarea>
    </div>
    <button type="submit" id="submit-btn" data-testid="submit-button">Submit</button>
  </form>

  <div id="result" style="display:none;">
    <h2>Form Submitted!</h2>
    <pre id="result-data"></pre>
  </div>

  <script>
    // Intercept form submit and send as XHR instead for testing
    document.getElementById('test-form').addEventListener('submit', function(e) {
      e.preventDefault();

      var formData = new URLSearchParams();
      formData.append('username', document.getElementById('username').value);
      formData.append('email', document.getElementById('email').value);
      formData.append('message', document.getElementById('message').value);

      fetch('/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: formData.toString()
      }).then(function(res) {
        // Even if it 404s, we captured the request
        document.getElementById('result').style.display = 'block';
        document.getElementById('result-data').textContent = formData.toString();
      }).catch(function() {
        document.getElementById('result').style.display = 'block';
        document.getElementById('result-data').textContent = formData.toString();
      });
    });
  </script>
</body>
</html>
